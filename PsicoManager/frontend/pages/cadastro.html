<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsicoManager - Criar Conta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="card auth-card border-0 shadow-sm p-4 p-md-5">
            
            <div class="text-center mb-4">
                <div class="auth-logo mb-3">
                    <i class="ph-fill ph-calendar-plus"></i>
                </div>
                <h2 class="fw-bold fs-4 mb-1">Crie sua conta</h2>
                <p class="text-muted small">Comece a organizar seus agendamentos agora.</p>
            </div>

            <form id="formCadastro">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">Nome Completo</label>
                    <input type="text" class="form-control" id="nome" placeholder="Ex: João da Silva" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">Senha</label>
                    <div class="input-group">
                        <input type="password" class="form-control border-end-0" id="senha" placeholder="Crie uma senha forte" required>
                        <span class="input-group-text bg-white border-start-0 password-toggle" onclick="togglePassword('senha', 'iconSenha')">
                            <i class="ph ph-eye" id="iconSenha"></i>
                        </span>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">Confirmar Senha</label>
                    <div class="input-group">
                        <input type="password" class="form-control border-end-0" id="confirmaSenha" placeholder="Repita sua senha" required>
                        <span class="input-group-text bg-white border-start-0 password-toggle" onclick="togglePassword('confirmaSenha', 'iconConfirmaSenha')">
                            <i class="ph ph-eye" id="iconConfirmaSenha"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-4 rounded-3" id="btnCadastrar">
                    Criar Conta
                </button>

                <div class="text-center small">
                    <span class="text-muted">Já possui uma conta?</span>
                    <a href="login.html" class="text-decoration-none fw-bold ms-1">Faça login</a>
                </div>
            </form>

        </div>
    </div>



    <script src="../scripts/auth.js"></script>

</body>
</html>
