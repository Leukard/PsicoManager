<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsicoManager - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="styles/global.css">

    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 2.5rem;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
        }
        .btn-google {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            color: #212529;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }
        .btn-google:hover {
            background-color: #f8f9fa;
            border-color: #c1c9d0;
        }
    </style>
</head>
<body>

    <div class="login-container text-center">
        <div class="mb-4">
            <i class="ph-fill ph-calendar-check text-primary mb-2" style="font-size: 3.5rem;"></i>
            <h2 class="fw-bold fs-4 mb-1">Bem-vindo de volta</h2>
            <p class="text-muted small">Acesse sua conta para gerenciar seus agendamentos.</p>
        </div>

        <button id="btnGoogleLogin" class="btn btn-google w-100 py-2 mb-3 rounded-3 shadow-sm">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" width="20" height="20">
            Entrar com o Google
        </button>

        <div class="mt-4 pt-3 border-top">
            <small class="text-muted d-block" style="font-size: 0.75rem;">Apenas usuários com conta google podem acessar o sistema PsicoManager.</small>
        </div>
    </div>

    <script>
        function getGoogleAuthUrl(){
            const isGoLiveLocal = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                && window.location.port === '5500';

            const backendOrigin = isGoLiveLocal ? 'http://localhost:5000' : '';
            return `${backendOrigin}/auth/google`;
        }

        document.getElementById('btnGoogleLogin').addEventListener('click', () => {
            window.location.href = getGoogleAuthUrl();
        });
    </script>
</body>
</html>
